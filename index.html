
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ayo Bangun.ID Contractor</title>
<link rel="manifest" href="manifest.json">
<style>
body{margin:0;background:#101827;color:#fff;font-family:Arial}
header{background:#17243b;padding:20px;text-align:center}
.logo{width:90px;border-radius:15px}
nav button{margin:5px;padding:12px;border:0;border-radius:10px;background:#c89b3c}
main{padding:15px}
.card{background:#1d304f;padding:15px;margin:10px 0;border-radius:12px}
input,select{padding:10px;width:90%;margin:5px}
</style>
</head>
<body>
<header>
<img class="logo" src="assets/logo.jpg">
<h2>Ayo Bangun.ID Contractor</h2>
<div>Construction Project Management</div>
</header>

<main id="app"></main>

<script>
let db={
projects:[
{name:"Gedung Kantor ABC",progress:65},
{name:"Rumah Tinggal",progress:40}
],
materials:[
{name:"Semen Portland",stock:"250 Zak"},
{name:"Besi Ulir 13mm",stock:"120 Batang"},
{name:"Pasir Beton",stock:"15 m3"}
],
attendance:[],
reports:[]
};

function save(){localStorage.setItem("ayoDB",JSON.stringify(db))}
let old=localStorage.getItem("ayoDB");
if(old) db=JSON.parse(old);

function render(){
document.getElementById("app").innerHTML=`
<nav>
<button onclick="dashboard()">Dashboard</button>
<button onclick="material()">Material</button>
<button onclick="report()">Laporan</button>
<button onclick="attendance()">Absensi</button>
</nav>
<div id="view"></div>`;
dashboard();
}

function dashboard(){
view.innerHTML=`
<div class="card">Project Aktif: ${db.projects.length}</div>
<div class="card">Material: ${db.materials.length} Item</div>
<div class="card">Laporan: ${db.reports.length}</div>
${db.projects.map(x=>`<div class="card">${x.name}<br>Progress ${x.progress}%</div>`).join("")}`;
}

function material(){
view.innerHTML=`<h3>Katalog Material</h3>${db.materials.map(x=>`<div class="card">${x.name}<br>${x.stock}</div>`).join("")}
<div class="card">
<input id="m" placeholder="Nama Material">
<button onclick="addMaterial()">Tambah</button>
</div>`;
}
function addMaterial(){
db.materials.push({name:m.value,stock:"0"});
save();material();
}

function attendance(){
view.innerHTML=`
<h3>Absensi Tenaga Kerja</h3>
<input id="worker" placeholder="Nama pekerja">
<button onclick="addAbs()">Simpan</button>
<div class="card">${db.attendance.join("<br>")}</div>`;
}
function addAbs(){
db.attendance.push(worker.value+" hadir");
save();attendance();
}

function report(){
view.innerHTML=`
<h3>Laporan Harian</h3>
<input id="txt" placeholder="Pekerjaan hari ini">
<button onclick="addReport()">Simpan</button>`;
}
function addReport(){
db.reports.push(txt.value);save();report();
}

render();

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
